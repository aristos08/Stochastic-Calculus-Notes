<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" role="img" aria-label="Supermartingale and submartingale conditional averages">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
    </marker>
  </defs>
  <g font-family="Charter, Georgia, serif" font-size="16" fill="#1f2430">
    <!-- supermartingale -->
    <line x1="40" y1="200" x2="260" y2="200" stroke="#1f2430" stroke-width="1.3" marker-end="url(#arr1)"/>
    <line x1="40" y1="200" x2="40" y2="40" stroke="#1f2430" stroke-width="1.3" marker-end="url(#arr1)"/>
    <text x="266" y="205">time</text>
    <text x="20" y="30">value</text>
    <g stroke="#9aa0ad" stroke-width="1.5">
      <line x1="90" y1="96" x2="215" y2="64"/>
      <line x1="90" y1="96" x2="215" y2="116"/>
      <line x1="90" y1="96" x2="215" y2="172"/>
    </g>
    <circle cx="90" cy="96" r="4.5" fill="#1f2430"/>
    <text x="78" y="84" font-style="italic">X<tspan font-size="12" dy="4">t</tspan></text>
    <circle cx="215" cy="132" r="4.5" fill="#d0342c"/>
    <text x="224" y="137" fill="#d0342c">𝔼[<tspan font-style="italic">X</tspan><tspan font-size="12" dy="4" font-style="italic">t+h</tspan><tspan dy="-4"> | ℱ</tspan><tspan font-size="12" dy="4" font-style="italic">t</tspan><tspan dy="-4">]</tspan></text>
    <text x="150" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#c0563a" font-weight="600">supermartingale</text>

    <!-- submartingale -->
    <line x1="420" y1="200" x2="640" y2="200" stroke="#1f2430" stroke-width="1.3" marker-end="url(#arr1)"/>
    <line x1="420" y1="200" x2="420" y2="40" stroke="#1f2430" stroke-width="1.3" marker-end="url(#arr1)"/>
    <text x="646" y="205">time</text>
    <text x="400" y="30">value</text>
    <g stroke="#9aa0ad" stroke-width="1.5">
      <line x1="470" y1="140" x2="595" y2="176"/>
      <line x1="470" y1="140" x2="595" y2="120"/>
      <line x1="470" y1="140" x2="595" y2="60"/>
    </g>
    <circle cx="470" cy="140" r="4.5" fill="#1f2430"/>
    <text x="460" y="164" font-style="italic">X<tspan font-size="12" dy="4">t</tspan></text>
    <circle cx="595" cy="100" r="4.5" fill="#d0342c"/>
    <text x="604" y="105" fill="#d0342c">𝔼[<tspan font-style="italic">X</tspan><tspan font-size="12" dy="4" font-style="italic">t+h</tspan><tspan dy="-4"> | ℱ</tspan><tspan font-size="12" dy="4" font-style="italic">t</tspan><tspan dy="-4">]</tspan></text>
    <text x="530" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#2a7fbf" font-weight="600">submartingale</text>
  </g>
</svg>
