    function report() {
      var ok = document.fonts.check('16px "CMUSerifWeb"');

                          : "web font: FALLBACK (Georgia) — CMU Serif did not load";

    }
    if (document.fonts.ready) document.fonts.ready.then(report); else report();
  });
</script>
