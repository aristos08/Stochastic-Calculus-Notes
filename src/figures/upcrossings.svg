<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 265" width="540" role="img" aria-label="A path making two upcrossings of the interval from a to b">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
    </marker>
  </defs>
  <g font-family="Charter, Georgia, serif" font-size="16" fill="#1f2430">
    <!-- shaded band between a and b -->
    <rect x="40" y="77" width="432" height="99" fill="#eef0ff"/>
    <line x1="40" y1="230" x2="496" y2="230" stroke="#1f2430" stroke-width="1.3" marker-end="url(#arr2)"/>
    <line x1="40" y1="230" x2="40" y2="23" stroke="#1f2430" stroke-width="1.3" marker-end="url(#arr2)"/>
    <text x="502" y="235" font-style="italic">n</text>
    <text x="30" y="15" font-style="italic">X<tspan font-size="12" dy="4">n</tspan></text>

    <line x1="40" y1="176" x2="472" y2="176" stroke="#5b6475" stroke-dasharray="6 4"/>
    <line x1="40" y1="77" x2="472" y2="77" stroke="#5b6475" stroke-dasharray="6 4"/>
    <text x="478" y="181" font-style="italic">a</text>
    <text x="478" y="82" font-style="italic">b</text>

    <g stroke="#9aa0ad" stroke-dasharray="3 3">
      <line x1="100" y1="230" x2="100" y2="198.5"/>
      <line x1="220" y1="230" x2="220" y2="59"/>
      <line x1="340" y1="230" x2="340" y2="194"/>
      <line x1="400" y1="230" x2="400" y2="54.5"/>
    </g>

    <!-- upcrossing segments highlighted -->
    <polyline points="100,198.5 160,135.5 220,59" fill="none" stroke="#3f8f3a" stroke-width="5" stroke-opacity="0.3" stroke-linejoin="round"/>
    <polyline points="340,194 400,54.5" fill="none" stroke="#3f8f3a" stroke-width="5" stroke-opacity="0.3"/>

    <polyline points="40,153.5 100,198.5 160,135.5 220,59 280,122 340,194 400,54.5 460,104"
              fill="none" stroke="#3b4cca" stroke-width="2.4" stroke-linejoin="round"/>
    <g fill="#3b4cca">
      <circle cx="40" cy="153.5" r="3"/><circle cx="100" cy="198.5" r="3.5"/>
      <circle cx="160" cy="135.5" r="3"/><circle cx="220" cy="59" r="3.5"/>
      <circle cx="280" cy="122" r="3"/><circle cx="340" cy="194" r="3.5"/>
      <circle cx="400" cy="54.5" r="3.5"/><circle cx="460" cy="104" r="3"/>
    </g>

    <g text-anchor="middle" font-style="italic">
      <text x="100" y="250">s<tspan font-size="12" dy="4">1</tspan></text>
      <text x="220" y="250">t<tspan font-size="12" dy="4">1</tspan></text>
      <text x="340" y="250">s<tspan font-size="12" dy="4">2</tspan></text>
      <text x="400" y="250">t<tspan font-size="12" dy="4">2</tspan></text>
    </g>
  </g>
</svg>
